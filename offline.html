<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta name="robots" content="noindex"/>
<meta name="theme-color" content="#FFFFFF"/>
<title>Sin conexión – Centro Kairós</title>
<link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png"/>
<style>
  :root{--blue:#2D3A8C;--orange:#F4702A;--bg:#F7F8FC;--surface:#fff;--ink:#0F1428;--ink-2:#465068;--line:#D9DEEC;--accent:var(--blue);color-scheme:light}
  @media (prefers-color-scheme:dark){:root{--bg:#0D1124;--surface:#171D3A;--ink:#EEF1FA;--ink-2:#B4BCD6;--line:#313A63;--accent:#A9B6FF;color-scheme:dark}}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);
    font-family:system-ui,-apple-system,'Segoe UI',sans-serif;font-size:18px;line-height:1.5;padding:24px}
  .caja{max-width:420px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:28px 24px;text-align:center}
  img{width:72px;height:72px;border-radius:16px;background:#fff}
  h1{font-family:Georgia,'Times New Roman',serif;font-size:1.6rem;margin:16px 0 8px}
  p{margin:0 0 12px;color:var(--ink-2)}
  button{margin-top:8px;min-height:56px;width:100%;border-radius:50px;border:0;background:var(--orange);color:#1b0c02;font:inherit;font-weight:700;cursor:pointer}
  button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
</style>
</head>
<body>
  <main class="caja">
    <img src="/icons/icon-192.png" alt=""/>
    <h1>No hay internet</h1>
    <p>Para ver tus horarios y tu cuota, el celular tiene que estar conectado.</p>
    <p>Revisá el wifi o los datos y probá de nuevo.</p>
    <button onclick="location.reload()">Probar de nuevo</button>
  </main>
</body>
</html>
