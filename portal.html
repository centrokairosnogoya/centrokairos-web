<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta name="robots" content="noindex"/>
<title>Portal del paciente – Centro Kairós</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<style>
  :root{
    --blue:#2D3A8C; --blue-d:#1a2260; --orange:#F4702A; --orange-d:#C2500F; --sky:#5BB8D4;
    --bg:#F7F8FC; --surface:#FFFFFF; --ink:#0F1428; --ink-2:#465068; --line:#D9DEEC;
    --tint:#EEF1FB; --tint-o:#FDEFE6; --ok:#17734A; --ok-bg:#E4F4EC; --warn:#8A4B00; --warn-bg:#FFF1DC;
    --bad:#A3261F; --bad-bg:#FBE9E7; --accent:var(--blue); --on-accent:#fff;
    --r:14px; --r-s:10px;
    color-scheme:light;
  }
  @media (prefers-color-scheme:dark){
    :root{
      --bg:#0D1124; --surface:#171D3A; --ink:#EEF1FA; --ink-2:#B4BCD6; --line:#313A63;
      --tint:#222A52; --tint-o:#3A2616; --ok:#7FD9A9; --ok-bg:#143326; --warn:#FFC978; --warn-bg:#3A2A0F;
      --bad:#FF9D94; --bad-bg:#3D1916; --accent:#A9B6FF; --on-accent:#0D1124; --orange-d:#FF9A5E;
      color-scheme:dark;
    }
  }
  *,*::before,*::after{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:'DM Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
    font-size:18px;line-height:1.5;padding-bottom:env(safe-area-inset-bottom,0px)}
  h1,h2{font-family:'Playfair Display',Georgia,'Times New Roman',serif;line-height:1.15;margin:0;letter-spacing:-.01em}
  h1{font-size:clamp(1.9rem,6.5vw,2.6rem);font-weight:900}
  h2{font-size:1.4rem;font-weight:700}
  h3{font-size:1.05rem;margin:0;font-weight:700}
  h1:focus{outline:none}
  p{margin:0}
  a{color:var(--accent)}
  .muted{color:var(--ink-2)}
  .small{font-size:.92rem}

  .top{display:flex;align-items:center;gap:12px;padding:calc(10px + env(safe-area-inset-top,0px)) 20px 10px;background:var(--surface);border-bottom:1px solid var(--line)}
  .top .logo{width:46px;height:46px;border-radius:12px;background:#fff;display:grid;place-items:center;flex:none;overflow:hidden}
  .top .logo img{width:42px;height:42px;object-fit:contain}
  .top .marca{font-weight:700;line-height:1.2}
  .top .marca span{display:block;font-weight:400;font-size:.85rem;color:var(--ink-2)}
  .top .sp{flex:1}
  .linkb{background:none;border:0;padding:10px 6px;font:inherit;font-weight:600;color:var(--accent);text-decoration:underline;text-underline-offset:3px;cursor:pointer}

  main{max-width:720px;margin:0 auto;padding:28px 20px 56px}
  .bloque{margin-top:36px}
  .bloque > h2{margin-bottom:6px}
  .bloque > .muted{margin-bottom:16px}
  .panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px}
  .panel + .panel{margin-top:12px}

  /* Formularios */
  label,.lbl{display:block;font-weight:600;margin-bottom:6px}
  .ayuda{font-size:.92rem;color:var(--ink-2);margin:-2px 0 8px}
  input[type=text],input[type=tel],input[type=date],input[type=number],select,textarea{
    width:100%;min-height:56px;padding:12px 14px;font:inherit;color:var(--ink);background:var(--surface);
    border:2px solid var(--line);border-radius:var(--r-s);appearance:none;-webkit-appearance:none}
  select{background-image:linear-gradient(45deg,transparent 50%,var(--ink-2) 50%),linear-gradient(135deg,var(--ink-2) 50%,transparent 50%);
    background-position:calc(100% - 22px) 50%,calc(100% - 15px) 50%;background-size:7px 7px;background-repeat:no-repeat;padding-right:40px}
  textarea{min-height:96px;resize:vertical}
  input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible,a:focus-visible,.op input:focus-visible + span{
    outline:3px solid var(--orange);outline-offset:2px}
  .campo{margin-top:20px}
  .fnac{display:grid;grid-template-columns:1fr 1.7fr 1.3fr;gap:10px}
  .fnac label{font-weight:400;font-size:.9rem;color:var(--ink-2);margin-bottom:4px}
  .ops{display:grid;gap:10px}
  @media (min-width:420px){.ops.dos{grid-template-columns:1fr 1fr}}
  .ops.dos .op span{height:100%}
  .op{display:block;position:relative;margin:0;font-weight:500;cursor:pointer}
  .op input{position:absolute;opacity:0;inset:0;width:100%;height:100%;margin:0;cursor:pointer}
  .op span{display:flex;align-items:center;gap:12px;min-height:56px;padding:12px 14px;border:2px solid var(--line);border-radius:var(--r-s);background:var(--surface)}
  .op span::before{content:"";flex:none;width:22px;height:22px;border-radius:50%;border:2px solid var(--ink-2)}
  .op input:checked + span{border-color:var(--accent);background:var(--tint)}
  .op input:checked + span::before{border:7px solid var(--accent)}
  .op small{display:block;color:var(--ink-2);font-weight:400}
  .trampa{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}

  .btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:56px;padding:12px 26px;border-radius:50px;
    font:inherit;font-weight:700;text-decoration:none;border:2px solid transparent;cursor:pointer;text-align:center}
  .btn.pri{background:var(--orange);color:#1b0c02}
  .btn.pri:hover{background:#ff8442}
  .btn.sec{background:transparent;color:var(--accent);border-color:var(--accent)}
  .btn.sec:hover{background:var(--tint)}
  .btn.wa{background:#128C4B;color:#fff}
  .btn.ancho{width:100%}
  .btn[disabled]{opacity:.6;cursor:default}
  .fila-btn{display:grid;gap:12px;margin-top:20px}
  @media (min-width:560px){.fila-btn.dos{grid-template-columns:1fr 1fr}}

  .aviso{margin-top:16px;padding:14px 16px;border-radius:var(--r-s);font-weight:500}
  .aviso.mal{background:var(--bad-bg);color:var(--bad)}
  .aviso.info{background:var(--tint);color:var(--ink)}
  .aviso:empty{display:none}

  /* Semana */
  .semana{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
  .dia{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-s);padding:10px 4px 12px;text-align:center;min-height:104px}
  .dia .n{font-size:.85rem;font-weight:600;color:var(--ink-2)}
  .dia.con{border-color:transparent;background:var(--tint)}
  .dia.con .n{color:var(--ink)}
  .dia.hoy{box-shadow:inset 0 0 0 2px var(--accent)}
  .dia .hoytxt{font-size:.75rem;color:var(--ink-2);line-height:1}
  .turno{display:block;margin:8px auto 0;padding:5px 2px;border-radius:8px;font-weight:700;font-size:1rem;line-height:1.1;max-width:64px}
  .turno.gimnasio{background:var(--blue);color:#fff}
  .turno.pilates{background:transparent;color:var(--orange-d);border:2px solid var(--orange-d)}
  .ref{display:flex;flex-wrap:wrap;gap:8px 20px;margin-top:12px;font-size:.92rem;color:var(--ink-2)}
  .ref i{display:inline-block;width:18px;height:14px;border-radius:4px;vertical-align:-2px;margin-right:6px}
  .ref .gimnasio{background:var(--blue)}
  .ref .pilates{border:2px solid var(--orange-d)}

  .serv{display:grid;gap:4px}
  .serv .linea{color:var(--ink-2)}
  .par{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
  .chip{display:inline-block;padding:5px 12px;border-radius:50px;font-size:.9rem;font-weight:700;white-space:nowrap}
  .chip.ok{background:var(--ok-bg);color:var(--ok)}
  .chip.warn{background:var(--warn-bg);color:var(--warn)}
  .chip.bad{background:var(--bad-bg);color:var(--bad)}
  .chip.neutro{background:var(--tint);color:var(--ink)}

  .pedido{display:grid;gap:6px}
  .pedido .resp{margin-top:6px;padding:10px 12px;border-left:4px solid var(--sky);background:var(--tint);border-radius:0 8px 8px 0}

  .volver{display:inline-block;margin-bottom:18px}
  .pie{margin-top:44px;padding-top:24px;border-top:1px solid var(--line);display:grid;gap:14px}
  [hidden]{display:none !important}
  @media (prefers-reduced-motion:no-preference){.btn,.op span{transition:background-color .15s,border-color .15s}}
</style>
</head>
<body>

<header class="top">
  <a class="logo" href="/" aria-label="Ir al sitio de Centro Kairós"><img src="images/img1.png" alt="" onerror="this.parentNode.hidden=true"/></a>
  <div class="marca">Centro Kairós<span>Portal del paciente</span></div>
  <div class="sp"></div>
  <button class="linkb" id="btn-salir" hidden>Salir</button>
</header>

<main id="app"></main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
/* ===== Conexión con Supabase (la misma base que la app de gestión) =====
   La clave es la "Publishable key": es pública y solo permite llamar a las
   funciones portal_* creadas con portal-paciente.sql. Nunca poner acá la Secret key. */
const SUPABASE_URL = 'https://zkmdvbztcuptzqmyaczq.supabase.co';
const SUPABASE_KEY = 'sb_publishable_UkaEpnVwQeqW7pxhhIJGzQ_2ujdcFdl';
const WHATSAPP = '543435419605';
/* Primer mes que se cobra en el sistema nuevo. Las cuotas de meses anteriores no se muestran,
   porque sus pagos no están cargados acá y figurarían como deuda. Formato: 'AAAA-MM-01'. */
const CUOTAS_DESDE = '2026-12-01';

const SERV = { gimnasio: 'Gimnasio para Adultos', pilates: 'Pilates Terapéutico' };
const TIPO = { ortopedia: 'elementos ortopédicos', magnetoterapia: 'magnetoterapia' };
const DIAS = [['lun', 'Lun', 'Lunes'], ['mar', 'Mar', 'Martes'], ['mie', 'Mié', 'Miércoles'], ['jue', 'Jue', 'Jueves'], ['vie', 'Vie', 'Viernes'], ['sab', 'Sáb', 'Sábado']];
const MESES = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];
const ESTADO = {
  pendiente: ['Pendiente de confirmación', 'warn'], confirmado: ['Confirmado', 'ok'], entregado: ['Lo tenés vos', 'ok'],
  devuelto: ['Devuelto', 'neutro'], cancelado: ['Cancelado', 'neutro'], rechazado: ['No disponible', 'bad']
};
/* Magnetoterapia: según la zona del cuerpo, el centro elige el tipo de equipo. La lista se puede editar acá. */
const ZONAS = ['Rodilla', 'Cadera', 'Hombro', 'Columna lumbar', 'Columna cervical', 'Tobillo o pie', 'Mano o muñeca', 'Codo'];
const camposMagneto = () => `
      <div class="campo"><label for="f-zona">¿Qué zona del cuerpo se va a tratar?</label><p class="ayuda">Según la zona elegimos el tipo de equipo.</p>
        <select id="f-zona"><option value="">Elegí</option>${ZONAS.map(z => `<option>${z}</option>`).join('')}<option value="__otra">Otra zona</option></select></div>
      <div class="campo" id="zona-otra-box" hidden><label for="f-zona-otra">¿Cuál?</label><input id="f-zona-otra" type="text" maxlength="40"/></div>
      <div class="campo"><label for="f-diag">Diagnóstico (opcional)</label><p class="ayuda">Si tenés la indicación del médico, escribí qué dice.</p><input id="f-diag" type="text" autocomplete="off" maxlength="100"/></div>`;
/* Zona y diagnóstico viajan al principio del comentario, así se ven en Pedidos de alquiler sin tocar la base */
const zonaElegida = () => { const z = $('f-zona') ? $('f-zona').value : ''; return z === '__otra' ? $('f-zona-otra').value.trim() : z; };
const notasMagneto = notas => { const d = $('f-diag').value.trim(); return ('Zona a tratar: ' + zonaElegida() + '. ' + (d ? 'Diagnóstico: ' + d.replace(/\.+$/, '') + '. ' : '') + notas).trim(); };
/* Plazos de alquiler: [lo que se guarda en el pedido, nombre, aclaración] */
const DURACIONES = [['15 días', 'Quincenal', '15 días'], ['1 mes', 'Mensual', '1 mes']];
const EQUIPOS_BASE = [
  { tipo: 'ortopedia', nombre: 'Muletas' }, { tipo: 'ortopedia', nombre: 'Andador' },
  { tipo: 'ortopedia', nombre: 'Silla de ruedas' }, { tipo: 'ortopedia', nombre: 'Bastón' },
  { tipo: 'magnetoterapia', nombre: 'Equipo de magnetoterapia' }
];

const $ = id => document.getElementById(id);
const app = $('app');
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pesos = n => '$ ' + Math.round(+n || 0).toLocaleString('es-AR');
const hoyISO = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
const fechaCorta = iso => { if (!iso) return ''; const [a, m, d] = String(iso).slice(0, 10).split('-'); return +d + ' de ' + MESES[+m - 1] + (a !== String(new Date().getFullYear()) ? ' de ' + a : ''); };
const horaCorta = h => { const m = String(h || '').match(/^(\d{1,2}):(\d{2})/); return m ? +m[1] + ':' + m[2] : String(h || ''); };
const nombrePila = n => { const t = String(n || '').trim(); const p = t.includes(',') ? t.split(',')[1].trim() : t; return p.split(/\s+/)[0] || ''; };
const soloNum = s => String(s || '').replace(/\D/g, '');
const dniOk = s => { const n = soloNum(s).length; return n >= 6 && n <= 9; };
/* El DNI del tercero viaja junto al nombre, así se ve en Pedidos de alquiler sin tocar la base */
const paraQuien = (nombre, dni) => nombre ? nombre + ' (DNI ' + soloNum(dni) + ')' : '';
const waLink = txt => 'https://wa.me/' + WHATSAPP + '?text=' + encodeURIComponent(txt);

let sb = null;
const S = { sesion: null, datos: null, equipos: null, vista: 'ingreso', form: null, hecho: null };

function conectar() {
  if (sb) return sb;
  if (!window.supabase) throw new Error('sin-libreria');
  sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, { auth: { persistSession: false, autoRefreshToken: false, detectSessionInUrl: false } });
  return sb;
}
async function llamar(fn, args) {
  const { data, error } = await conectar().rpc(fn, args);
  if (error) throw error;
  return data || {};
}
function textoError(e) {
  const m = String((e && (e.message || e.code)) || e);
  if (m === 'sin-libreria' || /Failed to fetch|NetworkError|Load failed/i.test(m)) return 'No hay conexión con el centro en este momento. Revisá tu internet y probá de nuevo.';
  if ((e && e.code === 'PGRST202') || /Could not find the function/i.test(m)) return 'El portal todavía no está activado. Avisanos por WhatsApp.';
  return 'Algo no funcionó. Probá de nuevo en un momento o escribinos por WhatsApp.';
}
const MOTIVOS = {
  no_coincide: 'No encontramos esos datos. Revisá el DNI y la fecha de nacimiento. Si siguen sin funcionar, escribinos por WhatsApp y lo vemos.',
  bloqueado: 'Hubo varios intentos seguidos con este DNI. Esperá 15 minutos y probá de nuevo.',
  inactivo: 'Tu ficha figura inactiva. Escribinos por WhatsApp y la reactivamos.',
  faltan_datos: 'Faltan datos para enviar el pedido. Revisá los campos.',
  falta_direccion: 'Falta la dirección donde se va a usar el equipo.',
  limite: 'Ya tenés varios pedidos sin confirmar. Escribinos por WhatsApp y los vemos juntos.',
  no_se_puede: 'Ese pedido ya no se puede cancelar desde acá. Escribinos por WhatsApp.'
};

async function cargarEquipos() {
  if (S.equipos) return S.equipos;
  try {
    const { data, error } = await conectar().from('portal_equipos').select('tipo, nombre, detalle, precio_texto').order('orden');
    S.equipos = !error && data && data.length ? data : EQUIPOS_BASE;
  } catch (e) { S.equipos = EQUIPOS_BASE; }
  return S.equipos;
}

/* ===== Sesión: DNI y fecha quedan solo mientras la pestaña está abierta ===== */
const guardarSesion = s => { S.sesion = s; try { s ? sessionStorage.setItem('kairos-portal', JSON.stringify(s)) : sessionStorage.removeItem('kairos-portal'); } catch (e) {} };
const leerSesion = () => { try { return JSON.parse(sessionStorage.getItem('kairos-portal') || 'null'); } catch (e) { return null; } };

async function ingresar(dni, fnac) {
  const r = await llamar('portal_ingresar', { p_dni: dni, p_fnac: fnac });
  if (!r.ok) return r;
  guardarSesion({ dni, fnac });
  S.datos = r;
  return r;
}
async function refrescar() {
  if (!S.sesion) return;
  const r = await llamar('portal_ingresar', { p_dni: S.sesion.dni, p_fnac: S.sesion.fnac });
  if (r.ok) S.datos = r;
}
function salir() { guardarSesion(null); S.datos = null; ir('ingreso'); }

/* ===== Navegación ===== */
function ir(vista, extra) {
  S.vista = vista;
  if (extra) Object.assign(S, extra);
  pintar();
  window.scrollTo(0, 0);
  const h = app.querySelector('h1'); if (h) { h.setAttribute('tabindex', '-1'); h.focus({ preventScroll: true }); }
}
function pintar() {
  $('btn-salir').hidden = !S.datos;
  app.innerHTML = ({ ingreso: vistaIngreso, inicio: vistaInicio, form: vistaForm, hecho: vistaHecho, cargando: () => '<p class="muted">Cargando…</p>' })[S.vista]();
}

/* ===== Ingreso ===== */
function vistaIngreso() {
  return `
  <h1>Tu espacio en Centro Kairós</h1>
  <p class="muted" style="margin-top:10px">Mirá tus horarios y tu cuota, y pedí el alquiler de equipos sin llamar.</p>

  <section class="panel" style="margin-top:24px">
    <h2>Ingresar</h2>
    <div class="campo">
      <label for="dni">Tu DNI</label>
      <p class="ayuda">Solo números, sin puntos.</p>
      <input id="dni" type="text" inputmode="numeric" autocomplete="off" maxlength="11"/>
    </div>
    <div class="campo">
      <span class="lbl" id="l-fnac">Tu fecha de nacimiento</span>
      <div class="fnac" role="group" aria-labelledby="l-fnac">
        <div><label for="fd">Día</label><input id="fd" type="text" inputmode="numeric" maxlength="2" autocomplete="bday-day"/></div>
        <div><label for="fm">Mes</label><select id="fm" autocomplete="bday-month"><option value="">Elegí</option>${MESES.map((m, i) => `<option value="${i + 1}">${m[0].toUpperCase() + m.slice(1)}</option>`).join('')}</select></div>
        <div><label for="fa">Año</label><input id="fa" type="text" inputmode="numeric" maxlength="4" autocomplete="bday-year"/></div>
      </div>
    </div>
    <div class="aviso mal" id="msg" role="alert"></div>
    <div class="fila-btn"><button class="btn pri ancho" id="btn-ingresar">Ingresar</button></div>
  </section>

  <div class="aviso info">
    <strong>¿Te acompaña un hijo o familiar?</strong><br/>
    Si querés, podés compartirle tu DNI y fecha de nacimiento para que entre a tu portal y esté al tanto de tus horarios y tu cuota.
  </div>

  <section class="bloque">
    <h2>¿Todavía no sos paciente?</h2>
    <p class="muted">Igual podés pedir el alquiler de un equipo. Te respondemos por WhatsApp.</p>
    <div class="fila-btn dos" style="margin-top:0">
      <a class="btn sec" href="/alquileres.html#ortopedia">Alquilar elementos ortopédicos</a>
      <a class="btn sec" href="/alquileres.html#magnetoterapia">Alquilar magnetoterapia</a>
    </div>
  </section>
  ${pie()}`;
}

async function onIngresar() {
  const msg = $('msg'), b = $('btn-ingresar');
  const dni = $('dni').value.replace(/\D/g, ''), d = +$('fd').value, m = +$('fm').value, a = +$('fa').value;
  const f = new Date(a, m - 1, d);
  if (dni.length < 6) { msg.textContent = 'Escribí tu DNI completo, solo números.'; $('dni').focus(); return; }
  if (!d || !m || a < 1900 || a > new Date().getFullYear() || f.getDate() !== d || f.getMonth() !== m - 1) { msg.textContent = 'Revisá tu fecha de nacimiento: día, mes y año con cuatro números.'; return; }
  const fnac = a + '-' + String(m).padStart(2, '0') + '-' + String(d).padStart(2, '0');
  msg.textContent = ''; b.disabled = true; b.textContent = 'Ingresando…';
  try {
    const r = await ingresar(dni, fnac);
    if (r.ok) return ir('inicio');
    msg.textContent = MOTIVOS[r.motivo] || MOTIVOS.no_coincide;
  } catch (e) { msg.textContent = textoError(e); }
  b.disabled = false; b.textContent = 'Ingresar';
}

/* ===== Inicio del paciente ===== */
function semana(servs) {
  const m = {};
  servs.forEach(s => {
    if (s.actividad === 'gimnasio') (s.dias || []).forEach(d => { if (s.hora) (m[d] = m[d] || []).push({ h: s.hora, a: 'gimnasio' }); });
    (s.turnos || []).forEach(t => (m[t.dia] = m[t.dia] || []).push({ h: t.hora, a: s.actividad }));
  });
  if (!Object.keys(m).length) return '<div class="panel"><p>Todavía no tenés horarios cargados. Consultá en recepción o escribinos por WhatsApp.</p></div>';
  const hoy = ['dom', 'lun', 'mar', 'mie', 'jue', 'vie', 'sab'][new Date().getDay()];
  const acts = [...new Set(servs.map(s => s.actividad))];
  return `<div class="semana">${DIAS.map(([k, corto, largo]) => {
    const L = (m[k] || []).sort((x, y) => String(x.h).localeCompare(String(y.h)));
    return `<div class="dia${L.length ? ' con' : ''}${k === hoy ? ' hoy' : ''}"><div class="n"><abbr title="${largo}" style="text-decoration:none">${corto}</abbr></div>${k === hoy ? '<div class="hoytxt">hoy</div>' : ''}${L.map(t => `<span class="turno ${t.a}" title="${SERV[t.a]}">${esc(horaCorta(t.h))}</span>`).join('') || '<span class="muted" aria-hidden="true" style="display:block;margin-top:14px">–</span>'}</div>`;
  }).join('')}</div>
  <div class="ref">${acts.map(a => `<span><i class="${a}"></i>${SERV[a]}</span>`).join('')}</div>`;
}

function tarjetaServicio(s) {
  const lineas = [];
  if (s.plan) lineas.push('Plan ' + esc(s.plan) + (s.clases_semana ? ' (' + s.clases_semana + (s.clases_semana == 1 ? ' clase' : ' clases') + ' por semana)' : ''));
  const profes = s.actividad === 'gimnasio' ? [s.profe] : (s.turnos || []).map(t => t.profe);
  const P = [...new Set(profes.filter(Boolean))];
  if (P.length) lineas.push('Con ' + P.map(esc).join(' y '));
  return `<div class="panel serv"><h3>${SERV[s.actividad]}</h3>${lineas.map(l => `<p class="linea">${l}</p>`).join('') || '<p class="linea">Sin plan cargado todavía.</p>'}</div>`;
}

/* Cuotas: el mes en curso de cada servicio y los meses anteriores que quedaron sin pagar */
function mesTitulo(per) {
  const a = per.slice(0, 4), m = MESES[+per.slice(5, 7) - 1];
  return m[0].toUpperCase() + m.slice(1) + (a !== String(new Date().getFullYear()) ? ' de ' + a : '');
}
function seccionCuotas(D) {
  const L = [];
  (D.deudas || []).forEach(d => L.push({ per: d.periodo, act: d.actividad, imp: +d.importe || 0, pag: +d.pagado || 0 }));
  (D.servicios || []).forEach(s => { if (s.cuota) L.push({ per: s.cuota.periodo, act: s.actividad, imp: +s.cuota.importe || 0, pag: +s.cuota.pagado || 0 }); });
  const ver = L.filter(x => x.per >= CUOTAS_DESDE && (x.imp > 0 || x.pag > 0)).sort((x, y) => x.per.localeCompare(y.per) || x.act.localeCompare(y.act));
  if (!ver.length) {
    /* Antes del primer mes que se cobra en el sistema nuevo, se anuncia la sección en vez de ocultarla */
    if (hoyISO().slice(0, 7) + '-01' >= CUOTAS_DESDE) return '';
    return `<section class="bloque"><div class="par"><h2>Tus cuotas</h2><span class="chip neutro">Próximamente</span></div>
      <div class="panel" style="margin-top:14px"><p>Desde ${MESES[+CUOTAS_DESDE.slice(5, 7) - 1]} vas a ver acá si tu cuota está paga o pendiente, y los meses que te falten pagar.</p></div></section>`;
  }
  const falta = x => Math.max(0, x.imp - x.pag), deben = ver.filter(x => falta(x) > 0), total = deben.reduce((n, x) => n + falta(x), 0);
  const fila = x => {
    const f = falta(x);
    const chip = !f ? '<span class="chip ok">Pagada</span>' : x.pag > 0 ? '<span class="chip warn">Pago parcial</span>' : '<span class="chip warn">Pendiente</span>';
    const det = !f ? '' : x.pag > 0 ? `Pagaste ${pesos(x.pag)} de ${pesos(x.imp)}. Falta ${pesos(f)}.` : pesos(x.imp);
    return `<div class="panel"><div class="par"><h3>${mesTitulo(x.per)}</h3>${chip}</div><p class="muted" style="margin-top:2px">${SERV[x.act] || ''}${det ? '<br>' + det : ''}</p></div>`;
  };
  return `<section class="bloque"><h2>Tus cuotas</h2>
    <p class="muted">${deben.length ? 'Tu cuota de este mes y los meses anteriores que figuran sin pagar. Si ves algo que no coincide, avisanos y lo revisamos.' : 'Estás al día.'}</p>
    ${ver.map(fila).join('')}
    ${deben.length > 1 ? `<p style="margin-top:14px;font-weight:700">En total tenés pendiente ${pesos(total)}.</p>` : ''}
  </section>`;
}

function tarjetaPedido(p) {
  const [txt, cls] = ESTADO[p.estado] || [p.estado, 'neutro'];
  const det = [p.desde ? 'Desde el ' + fechaCorta(p.desde) : '', p.duracion || ''].filter(Boolean).join(', ');
  return `<div class="panel pedido">
    <div class="par"><h3>${esc(p.equipo)}</h3><span class="chip ${cls}">${txt}</span></div>
    <p class="muted small">Pedido N.º ${p.id}, enviado el ${fechaCorta(p.creado)}${det ? '. ' + esc(det) : ''}</p>
    ${p.respuesta ? `<p class="resp">${esc(p.respuesta)}</p>` : ''}
    ${p.estado === 'pendiente' ? `<div><button class="linkb" data-cancelar="${p.id}" style="padding-left:0">Cancelar este pedido</button></div>` : ''}
  </div>`;
}

function vistaInicio() {
  const D = S.datos, servs = D.servicios || [], sol = D.solicitudes || [];
  return `
  <h1>Hola, ${esc(nombrePila(D.nombre))}</h1>

  <section class="bloque" style="margin-top:24px">
    <h2>Tu semana</h2>
    <p class="muted">Tus días y horarios en el centro.</p>
    ${semana(servs)}
    <div style="margin-top:14px">${servs.map(tarjetaServicio).join('')}</div>
  </section>

  ${seccionCuotas(D)}

  <section class="bloque">
    <h2>Alquiler de equipos</h2>
    <p class="muted">Como paciente del centro, tu pedido tiene prioridad sobre los equipos disponibles.</p>
    <div class="fila-btn dos" style="margin-top:0">
      <button class="btn pri" data-pedir="ortopedia">Pedir elementos ortopédicos</button>
      <button class="btn pri" data-pedir="magnetoterapia">Pedir magnetoterapia</button>
    </div>
    <div class="aviso mal" id="msg" role="alert"></div>
    ${sol.length ? `<h3 style="margin:26px 0 12px">Tus pedidos</h3>${sol.map(tarjetaPedido).join('')}` : ''}
  </section>
  ${pie()}`;
}

async function onCancelar(id) {
  if (!confirm('¿Cancelar este pedido?')) return;
  try {
    const r = await llamar('portal_cancelar_solicitud', { p_dni: S.sesion.dni, p_fnac: S.sesion.fnac, p_id: +id });
    await refrescar(); pintar();
    if (!r.ok) $('msg').textContent = MOTIVOS[r.motivo] || MOTIVOS.no_se_puede;
  } catch (e) { $('msg').textContent = textoError(e); }
}

/* ===== Formulario de alquiler ===== */
async function abrirForm(tipo) {
  ir('cargando');
  await cargarEquipos();
  ir('form', { form: { tipo } });
}

function vistaForm() {
  const tipo = S.form.tipo, socio = !!S.datos, D = S.datos || {};
  const L = S.equipos.filter(e => e.tipo === tipo);
  const unico = L.length === 1;
  return `
  <button class="linkb volver" id="btn-volver" style="padding-left:0">Volver</button>
  <h1>Alquilar ${TIPO[tipo]}</h1>
  <p class="muted" style="margin-top:10px">Completá el pedido y te confirmamos por WhatsApp si el equipo está disponible y cuánto sale.</p>

  <section class="panel" style="margin-top:24px">
    ${socio ? '' : `
    <div class="campo" style="margin-top:0"><label for="f-nombre">Nombre y apellido</label><input id="f-nombre" type="text" autocomplete="name" maxlength="120"/></div>
    <div class="campo"><label for="f-tel">Tu WhatsApp</label><p class="ayuda">Con característica, por ejemplo 3435 123456.</p><input id="f-tel" type="tel" autocomplete="tel" maxlength="40"/></div>
    <div class="campo"><label for="f-dni">DNI (opcional)</label><input id="f-dni" type="text" inputmode="numeric" maxlength="11"/></div>
    <div class="trampa" aria-hidden="true"><label for="f-web">No completar</label><input id="f-web" type="text" tabindex="-1" autocomplete="off"/></div>`}

    <div class="campo"${socio ? ' style="margin-top:0"' : ''}>
      <span class="lbl" id="l-eq">¿Qué equipo necesitás?</span>
      <div class="ops" role="radiogroup" aria-labelledby="l-eq">
        ${L.map((e, i) => `<label class="op"><input type="radio" name="equipo" value="${esc(e.nombre)}"${unico && i === 0 ? ' checked' : ''}/><span><b style="font-weight:600">${esc(e.nombre)}${e.detalle || e.precio_texto ? `<small>${esc([e.detalle, e.precio_texto].filter(Boolean).join(', '))}</small>` : ''}</b></span></label>`).join('')}
        <label class="op"><input type="radio" name="equipo" value="__otro"/><span>Otro</span></label>
      </div>
      <div id="otro-box" hidden style="margin-top:10px"><label for="f-otro">¿Cuál?</label><input id="f-otro" type="text" maxlength="120"/></div>
    </div>

    ${tipo === 'magnetoterapia' ? camposMagneto() : ''}
    <div class="campo"><label for="f-desde">¿Desde qué día?</label><input id="f-desde" type="date" min="${hoyISO()}" value="${hoyISO()}"/></div>
    <div class="campo"><span class="lbl" id="l-dur">¿Por cuánto tiempo?</span>
      <div class="ops dos" role="radiogroup" aria-labelledby="l-dur">${DURACIONES.map(([v, t, d]) => `<label class="op"><input type="radio" name="dur" value="${v}"/><span><b style="font-weight:600">${t}<small>${d}</small></b></span></label>`).join('')}</div></div>

    <div class="campo">
      <span class="lbl" id="l-dir">Dirección donde se va a usar</span>
      ${socio && D.tiene_direccion ? `
      <div class="ops" role="radiogroup" aria-labelledby="l-dir">
        <label class="op"><input type="radio" name="dir" value="ficha" checked/><span>La que ya tienen en mi ficha</span></label>
        <label class="op"><input type="radio" name="dir" value="otra"/><span>Otra dirección</span></label>
      </div>
      <div id="dir-box" hidden style="margin-top:10px"><label for="f-dir">Calle y número</label><input id="f-dir" type="text" autocomplete="street-address" maxlength="200"/></div>`
      : `<input id="f-dir" type="text" aria-labelledby="l-dir" autocomplete="street-address" maxlength="200" placeholder="Calle y número"/>`}
    </div>

    ${socio ? `<div class="campo"><label for="f-tel">Otro teléfono (opcional)</label><p class="ayuda">${D.tel_fin ? 'Te escribimos al número terminado en ' + esc(D.tel_fin) + '. Completá esto solo si preferís otro.' : 'No tenemos tu teléfono en la ficha: dejanos uno para confirmarte.'}</p><input id="f-tel" type="tel" autocomplete="tel" maxlength="40"/></div>` : ''}

    <div class="campo"><label for="f-para">¿Es para otra persona? (opcional)</label><p class="ayuda">Si es para un familiar, escribí su nombre y apellido.</p><input id="f-para" type="text" autocomplete="off" maxlength="90"/></div>
    <div class="campo" id="para-dni-box" hidden><label for="f-para-dni">DNI de esa persona</label><p class="ayuda">Solo números, sin puntos.</p><input id="f-para-dni" type="text" inputmode="numeric" autocomplete="off" maxlength="11"/></div>
    <div class="campo"><label for="f-notas">Algo más que debamos saber (opcional)</label><textarea id="f-notas" maxlength="340"></textarea></div>

    <div class="aviso mal" id="msg" role="alert"></div>
    <div class="fila-btn"><button class="btn pri ancho" id="btn-enviar">Enviar pedido</button></div>
  </section>`;
}

async function onEnviar() {
  const msg = $('msg'), b = $('btn-enviar'), socio = !!S.datos, D = S.datos || {}, v = id => ($(id) ? $(id).value.trim() : '');
  const sel = document.querySelector('input[name=equipo]:checked');
  const equipo = !sel ? '' : sel.value === '__otro' ? v('f-otro') : sel.value;
  const dirSel = document.querySelector('input[name=dir]:checked');
  const usarFicha = !!(dirSel && dirSel.value === 'ficha');
  const err = (t, id) => { msg.textContent = t; if (id && $(id)) $(id).focus(); };

  if (!socio && v('f-nombre').length < 3) return err('Escribí tu nombre y apellido.', 'f-nombre');
  if (!socio && v('f-tel').replace(/\D/g, '').length < 8) return err('Escribí tu WhatsApp con característica.', 'f-tel');
  if (socio && !D.tel_fin && v('f-tel').replace(/\D/g, '').length < 8) return err('Dejanos un teléfono para confirmarte el pedido.', 'f-tel');
  if (!equipo) return err('Elegí qué equipo necesitás.');
  const esMagneto = S.form.tipo === 'magnetoterapia';
  if (esMagneto && !$('f-zona').value) return err('Elegí la zona del cuerpo que se va a tratar.', 'f-zona');
  if (esMagneto && !zonaElegida()) return err('Escribí qué zona se va a tratar.', 'f-zona-otra');
  const dur = document.querySelector('input[name=dur]:checked');
  if (!dur) return err('Elegí por cuánto tiempo lo necesitás: quincenal o mensual.');
  if (!usarFicha && v('f-dir').length < 4) return err('Escribí la dirección donde se va a usar el equipo.', 'f-dir');
  if (v('f-para') && !dniOk(v('f-para-dni'))) return err('Escribí el DNI de la persona que va a usar el equipo.', 'f-para-dni');
  if ($('f-web') && $('f-web').value) return;

  const pedido = { tipo: S.form.tipo, equipo, desde: v('f-desde'), duracion: dur.value, direccion: usarFicha ? '' : v('f-dir'),
    usar_direccion_ficha: usarFicha, telefono: v('f-tel'), para_quien: paraQuien(v('f-para'), v('f-para-dni')), notas: esMagneto ? notasMagneto(v('f-notas')) : v('f-notas') };
  if (!socio) { pedido.nombre = v('f-nombre'); pedido.dni = v('f-dni'); }

  msg.textContent = ''; b.disabled = true; b.textContent = 'Enviando…';
  try {
    const r = socio
      ? await llamar('portal_pedir_alquiler', { p_dni: S.sesion.dni, p_fnac: S.sesion.fnac, p_pedido: pedido })
      : await llamar('portal_pedir_alquiler_publico', { p_pedido: pedido });
    if (r.ok) {
      if (socio) { try { await refrescar(); } catch (e) {} }
      return ir('hecho', { hecho: { id: r.id, equipo, nombre: socio ? D.nombre : pedido.nombre } });
    }
    msg.textContent = r.motivo === 'limite' && !socio ? 'Ya recibimos varios pedidos desde este teléfono. Escribinos por WhatsApp y lo vemos.' : (MOTIVOS[r.motivo] || MOTIVOS.faltan_datos);
    if (r.motivo === 'no_coincide' || r.motivo === 'inactivo') { salir(); return; }
  } catch (e) { msg.textContent = textoError(e); }
  b.disabled = false; b.textContent = 'Enviar pedido';
}

function vistaHecho() {
  const h = S.hecho;
  const txt = `Hola, soy ${h.nombre}. Acabo de pedir el alquiler de ${h.equipo} desde la web (pedido N.º ${h.id}).`;
  return `
  <h1>Recibimos tu pedido</h1>
  <section class="panel" style="margin-top:24px">
    <p><strong>${esc(h.equipo)}</strong>, pedido N.º ${h.id}.</p>
    <p style="margin-top:10px">${S.datos
      ? 'Te confirmamos disponibilidad y precio por WhatsApp, y también vas a ver la respuesta acá, en Tus pedidos.'
      : 'La respuesta no se ve en esta página: te la mandamos por WhatsApp al número que dejaste, con la disponibilidad y el precio.'}</p>
    <p style="margin-top:10px">Para que lo veamos enseguida, avisanos con el botón de abajo.</p>
    <div class="fila-btn">
      <a class="btn wa ancho" href="${waLink(txt)}" target="_blank" rel="noopener">Avisar por WhatsApp</a>
      <button class="btn sec ancho" id="btn-volver">${S.datos ? 'Volver a mi portal' : 'Volver al inicio'}</button>
    </div>
  </section>`;
}

function pie() {
  return `<footer class="pie">
    <div><h3>¿Necesitás ayuda?</h3><p class="muted">Lunes a viernes de 8 a 20 y sábados de 9 a 14. Hipólito Yrigoyen 109, Nogoyá.</p></div>
    <div><a class="btn wa" href="${waLink('Hola, Centro Kairós. Les escribo desde el portal del paciente.')}" target="_blank" rel="noopener">Escribir por WhatsApp</a></div>
    <p class="small"><a href="/">Volver al sitio de Centro Kairós</a></p>
  </footer>`;
}

/* ===== Eventos ===== */
document.addEventListener('click', e => {
  const t = e.target.closest('button, a'); if (!t) return;
  if (t.id === 'btn-ingresar') return onIngresar();
  if (t.id === 'btn-salir') return salir();
  if (t.id === 'btn-enviar') return onEnviar();
  if (t.id === 'btn-volver') return ir(S.datos ? 'inicio' : 'ingreso');
  if (t.dataset.pedir) return abrirForm(t.dataset.pedir);
  if (t.dataset.cancelar) return onCancelar(t.dataset.cancelar);
});
document.addEventListener('input', e => {
  if (e.target.id === 'f-para' && $('para-dni-box')) $('para-dni-box').hidden = !e.target.value.trim();
});
document.addEventListener('change', e => {
  if (e.target.name === 'equipo') $('otro-box').hidden = e.target.value !== '__otro';
  if (e.target.id === 'f-zona') { $('zona-otra-box').hidden = e.target.value !== '__otra'; if (e.target.value === '__otra') $('f-zona-otra').focus(); }
  if (e.target.name === 'dir' && $('dir-box')) $('dir-box').hidden = e.target.value !== 'otra';
});
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && S.vista === 'ingreso' && e.target.matches('#dni, #fd, #fa')) onIngresar();
});

/* ===== Arranque ===== */
(async function () {
  const s = leerSesion();
  if (s && s.dni && s.fnac) {
    ir('cargando');
    try { const r = await ingresar(s.dni, s.fnac); if (r.ok) return ir('inicio'); } catch (e) {}
    guardarSesion(null);
  }
  ir('ingreso');
})();
</script>
</body>
</html>
